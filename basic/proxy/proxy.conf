# Docker internal DNS resolver
resolver 127.0.0.11 valid=30s;

# Global HTTP to HTTPS Redirect
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server; # <-- Marks this as the master trap for port 443
    server_name _;

    # Use your existing wildcard certificates so the SSL handshake succeeds
    ssl_certificate /etc/letsencrypt/live/lblam.tma-demos.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lblam.tma-demos.shop/privkey.pem;

    # Option A: Return a clean 404 page
    location / {
        return 404 "Error: The requested subdomain does not exist.\n";
    }
}
# Python Application
server {
    listen 443 ssl;
    server_name python.lblam.tma-demos.shop;

    ssl_certificate /etc/letsencrypt/live/lblam.tma-demos.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lblam.tma-demos.shop/privkey.pem;

    location / {
        set $upstream_python python-app;
        proxy_pass http://$upstream_python:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

