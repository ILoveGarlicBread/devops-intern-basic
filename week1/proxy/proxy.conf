# Docker internal DNS resolver
resolver 127.0.0.11 valid=30s;

# Global HTTP to HTTPS Redirect
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

# Python Application
server {
    listen 443 ssl;
    server_name python.lblam.tma-demos.shop;

    ssl_certificate /etc/letsencrypt/live/lblam.tma-demos.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lblam.tma-demos.shop/privkey.pem;

    location / {
        set $upstream_python python-app;
        proxy_pass http://$upstream_python:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

