---
- name: Deploy External Secrets Operator (ESO)
  hosts: master
  become: yes
  tasks:
    - name: Add the External Secrets Helm repository
      kubernetes.core.helm_repository:
        name: external-secrets
        repo_url: "https://charts.external-secrets.io"

    - name: Deploy External Secrets Operator via Helm
      kubernetes.core.helm:
        kubeconfig: /etc/rancher/rke2/rke2.yaml
        name: external-secrets
        chart_ref: external-secrets/external-secrets
        release_namespace: external-secrets
        create_namespace: true
        update_repo_cache: true
        values:
          installCRDs: true
          webhook:
            port: 9443
