- name: Play 2 - Deploy Fineract via Native Kubernetes Manifests
  hosts: master
  become: yes
  tasks:
    - name: Create Fineract Namespace
      kubernetes.core.k8s:
        kubeconfig: /etc/rancher/rke2/rke2.yaml
        name: fineract
        api_version: v1
        kind: Namespace
        state: present

    - name: Deploy Fineract via Helm
      kubernetes.core.helm:
        kubeconfig: /etc/rancher/rke2/rke2.yaml
        name: fineract
        chart_ref: /home/ubuntu/TMA-DevOps-Lam-Internship/advanced/fineract
        release_namespace: fineract
        create_namespace: true
        values_files:
          - /home/ubuntu/TMA-DevOps-Lam-Internship/advanced/ansible/fineract-values.yaml
