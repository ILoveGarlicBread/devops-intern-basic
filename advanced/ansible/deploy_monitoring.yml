---
- name: Deploy Monitoring Stack
  hosts: master
  become: yes
  tasks:
    - name: Ensure pip is installed
      apt:
        name: python3-pip
        state: present
        update_cache: yes

    - name: Ensure kubernetes python module is installed
      pip:
        name: kubernetes
        state: present

    - name: Add Prometheus Community Helm Repository
      kubernetes.core.helm_repository:
        name: prometheus-community
        repo_url: "https://prometheus-community.github.io/helm-charts"
        
    - name: Create monitoring namespace
      kubernetes.core.k8s:
        kubeconfig: /etc/rancher/rke2/rke2.yaml
        name: monitoring
        api_version: v1
        kind: Namespace
        state: present

    - name: Create fineract namespace
      kubernetes.core.k8s:
        kubeconfig: /etc/rancher/rke2/rke2.yaml
        name: fineract
        api_version: v1
        kind: Namespace
        state: present

    - name: Deploy Kube-Prometheus-Stack
      kubernetes.core.helm:
        kubeconfig: /etc/rancher/rke2/rke2.yaml
        name: prometheus-stack
        chart_ref: prometheus-community/kube-prometheus-stack
        release_namespace: monitoring
        chart_version: 86.3.1
        values_files:
          - /home/ubuntu/TMA-DevOps-Lam-Internship/advanced/helm_values/monitoring/prometheus-values.yaml

    - name: Deploy MySQL Exporter (Default DB)
      kubernetes.core.helm:
        kubeconfig: /etc/rancher/rke2/rke2.yaml
        name: mysql-exporter-default
        chart_ref: prometheus-community/prometheus-mysql-exporter
        release_namespace: monitoring
        chart_version: 2.14.0
        values_files:
          - /home/ubuntu/TMA-DevOps-Lam-Internship/advanced/helm_values/monitoring/mysql-default-values.yaml

    - name: Deploy MySQL Exporter (Tenants DB)
      kubernetes.core.helm:
        kubeconfig: /etc/rancher/rke2/rke2.yaml
        name: mysql-exporter-tenants
        chart_ref: prometheus-community/prometheus-mysql-exporter
        release_namespace: monitoring
        chart_version: 2.14.0
        values_files:
          - /home/ubuntu/TMA-DevOps-Lam-Internship/advanced/helm_values/monitoring/mysql-tenants-values.yaml

    - name: Apply additional manifests (Longhorn, Fineract, Dashboards)
      kubernetes.core.k8s:
        kubeconfig: /etc/rancher/rke2/rke2.yaml
        state: present
        src: "/home/ubuntu/TMA-DevOps-Lam-Internship/advanced/helm_values/monitoring/{{ item }}"
      loop:
        - longhorn-prometheus-rules.yaml
        - longhorn-servicemonitor.yaml
        - fineract-business-exporter.yaml
        - fineract-business-rules.yaml
        - fineract-business-dashboard.yaml
        - mysql-dashboard-cm.yaml
        - kanister-dashboard-cm.yaml
