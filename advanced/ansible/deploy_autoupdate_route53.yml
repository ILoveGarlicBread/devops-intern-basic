---
- name: Deploy Complete Automated Infrastructure Stack
  hosts: worker
  become: true
  vars:
    public_ip_api_url: "https://checkip.amazonaws.com"
    hosted_zone_id: "Z05312152ONGPJ6N7P6AL" 
    domain_name: "lblam.tma-demos.shop"

  tasks:
    # --- 1. DYNAMIC DNS UPDATE (ROUTE 53) ---
    - name: Fetch current public IP of the Spot Instance
      uri:
        url: "{{ public_ip_api_url }}"
        return_content: true
      register: ip_response

    - name: Clean public IP string
      set_fact:
        spot_public_ip: "{{ ip_response.content | trim }}"

    - name: Update Route 53 Wildcard A Record
      amazon.aws.route53:
        zone: "{{ domain_name }}"
        record: "{% if 'worker-1' in inventory_hostname %}fineract{% elif 'worker-2' in inventory_hostname %}monitoring{% elif 'worker-3' in inventory_hostname %}logging{% else %}fineract{% endif %}.{{ domain_name }}"
        type: A
        ttl: 300
        state: present
        value: "{{ spot_public_ip }}"
        overwrite: true
      delegate_to: localhost
      become: false

    - name: Ensure prerequisite packages are installed (Ubuntu)
      apt:
        name: 
          - unzip
          - curl
        state: present
        update_cache: yes

    - name: Check if AWS CLI is already installed
      command: aws --version
      register: aws_cli_check
      ignore_errors: yes
      changed_when: false

    - name: Download and install AWS CLI v2 if missing
      shell: |
        curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
        unzip -o awscliv2.zip
        sudo ./aws/install --update
        rm -rf awscliv2.zip ./aws
      when: aws_cli_check.rc != 0
    # Auto update ip on route53
    - name: Create local script directory
      file:
        path: /usr/local/bin
        state: directory
        mode: '0755'

    - name: Deploy dynamic DNS update script
      copy:
        dest: /usr/local/bin/update-route53.sh
        mode: '0755'
        content: |
          #!/bin/bash
          PUBLIC_IP=$(curl -s https://checkip.amazonaws.com)
          ZONE_ID="Z05312152ONGPJ6N7P6AL"
          
          # Fix: Use Ansible templating instead of EC2 hostname bash check
          DOMAIN="{% if 'worker-1' in inventory_hostname %}fineract{% elif 'worker-2' in inventory_hostname %}monitoring{% elif 'worker-3' in inventory_hostname %}logging{% else %}fineract{% endif %}.{{ domain_name }}"

          # Build the payload file
          cat << EOF > /tmp/route53-update.json
          {
            "Comment": "Automated IP update on systemd boot initialization",
            "Changes": [
              {
                "Action": "UPSERT",
                "ResourceRecordSet": {
                  "Name": "$DOMAIN",
                  "Type": "A",
                  "TTL": 60,
                  "ResourceRecords": [{ "Value": "$PUBLIC_IP" }]
                }
              }
            ]
          }
          EOF

          # Send the update to Route 53 using the instance's IAM Profile
          aws route53 change-resource-record-sets --hosted-zone-id $ZONE_ID --change-batch file:///tmp/route53-update.json

    - name: Deploy Systemd Service for boot tracking
      copy:
        dest: /etc/systemd/system/update-dns.service
        mode: '0644'
        content: |
          [Unit]
          Description=Update Route 53 Wildcard DNS on Boot
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=oneshot
          ExecStart=/usr/local/bin/update-route53.sh
          RemainAfterExit=yes

          [Install]
          WantedBy=multi-user.target

    - name: Enable the DNS update service so it runs on next boot
      systemd:
        name: update-dns
        enabled: true
        daemon_reload: true
        state: restarted
