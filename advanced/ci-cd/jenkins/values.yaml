jenkins:
  controller:
    csrf:
      defaultCrumbIssuer:
        enabled: false
    image:
      tag: "latest-jdk17"
    installPlugins:
      - kubernetes
      - workflow-aggregator
      - git
      - configuration-as-code
      - docker-workflow
    ingress:
      enabled: true
      hostName: jenkins.lblam.tma-demos.shop
  persistence:
    enabled: true
    storageClass: longhorn
    size: "15Gi"
