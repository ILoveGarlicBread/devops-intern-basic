apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: vault-selfsigned-issuer
  namespace: vault
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: vault-ca
  namespace: vault
spec:
  isCA: true
  commonName: vault-ca
  secretName: vault-ca-secret
  issuerRef:
    name: vault-selfsigned-issuer
    kind: Issuer
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: vault-ca-issuer
  namespace: vault
spec:
  ca:
    secretName: vault-ca-secret
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: vault-tls
  namespace: vault
spec:
  secretName: vault-tls
  issuerRef:
    name: vault-ca-issuer
    kind: Issuer
  commonName: vault.vault.svc.cluster.local
  dnsNames:
  - vault.vault.svc.cluster.local
  - vault.vault.svc
  - vault-active.vault.svc.cluster.local
  - vault-standby.vault.svc.cluster.local
  - vault-internal.vault.svc.cluster.local
  - "*.vault-internal.vault.svc.cluster.local"
  - localhost
  - 127.0.0.1
