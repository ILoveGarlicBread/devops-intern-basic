replicaCount: 1

image:
  repository: 205714230466.dkr.ecr.ap-south-1.amazonaws.com/ai-agent
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext: {}

securityContext: {}

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false

httpRoute:
  enabled: false

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

env:
  # Using AWS default credentials chain
  # Or provide AWS_REGION and credentials via secret if not using IAM Roles
  - name: AWS_REGION
    value: "us-east-1"

autoscaling:
  enabled: false

affinity: {}
nodeSelector: {}
tolerations: []
podLabels: {}
volumeMounts: []
volumes: []
livenessProbe:
  httpGet:
    path: /
    port: http
readinessProbe:
  httpGet:
    path: /
    port: http
