replicaCount: 1

image:
  repository: 205714230466.dkr.ecr.ap-south-1.amazonaws.com/ai-agent
  pullPolicy: Always
  tag: "latest"

imagePullSecrets:
  - name: ecr-registry-secret
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext: {}

securityContext: {}

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false

httpRoute:
  enabled: false

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 1Gi

env:
  # Using AWS default credentials chain
  # Or provide AWS_REGION and credentials via secret if not using IAM Roles
  - name: AWS_REGION
    value: "ap-south-1"

autoscaling:
  enabled: false

affinity: {}
nodeSelector: {}
tolerations: []
podLabels: {}
volumeMounts:
  - name: main-py-script
    mountPath: /app/main.py
    subPath: main.py
  - name: litellm-config-vol
    mountPath: /app/litellm_config.yaml
    subPath: config.yaml

volumes:
  - name: main-py-script
    configMap:
      name: ai-agent-config
  - name: litellm-config-vol
    configMap:
      name: litellm-config
livenessProbe: {}
readinessProbe: {}
