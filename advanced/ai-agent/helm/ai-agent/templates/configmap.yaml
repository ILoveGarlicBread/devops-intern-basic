apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ai-agent.fullname" . }}-config
  labels:
    {{- include "ai-agent.labels" . | nindent 4 }}
data:
  main.py: |-
    import os
    import time
    from openai import AsyncOpenAI
    from agents import Agent, Runner, function_tool
    from agents.models.openai_chatcompletions import OpenAIChatCompletionsModel
    from aws_bedrock_token_generator import provide_token
    
    @function_tool
    def get_weather(location: str):
        """Get the current weather in a given location."""
        return f"The weather in {location} is 72 degrees and sunny."
    
    if __name__ == "__main__":
        print("Connecting natively to AWS Bedrock Mantle Endpoint...")
        client = AsyncOpenAI(
            api_key=os.environ.get("OPENAI_API_KEY")
        )
        my_agent = Agent(
            name="BedrockAssistant",
            instructions="You are a helpful assistant powered by OpenAI.",
            tools=[get_weather],
            model=OpenAIChatCompletionsModel(
                model="gpt-4o-mini", 
                openai_client=client
            )
        )
        print("Agent is ready! (Type 'exit' to quit)")
        runner = Runner()
        
        while True:
            user_input = input("User: ")
            if user_input.lower() in ['exit', 'quit']:
                break
            
            response = runner.run_sync(starting_agent=my_agent, input=user_input)
            print(f"Agent: {response.final_output}")
