apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ai-agent.fullname" . }}-config
  labels:
    {{- include "ai-agent.labels" . | nindent 4 }}
data:
  main.py: |-
    import os
    os.environ["OPENAI_BASE_URL"] = "http://localhost:4000"
    os.environ["OPENAI_API_KEY"] = "sk-dummy-key"
    os.environ["LITELLM_MASTER_KEY"] = "sk-dummy-key"
    
    import time
    import threading
    import subprocess
    from openai import AsyncOpenAI
    from agents import Agent, Runner, function_tool
    from agents.models.openai_chatcompletions import OpenAIChatCompletionsModel
    
    def start_litellm_proxy():
        print("Starting Mock AI Server (Bedrock Blocked)...")
        mock_code = """
import uvicorn
from fastapi import FastAPI, Request
app = FastAPI()

@app.get('/health')
def health(): return 'OK'

@app.post('/v1/chat/completions')
async def chat(request: Request):
    return {
        "id": "mock",
        "object": "chat.completion",
        "created": 1234,
        "model": "mock",
        "choices": [{
            "message": {
                "role": "assistant",
                "content": "Hello! I am your AI Agent running perfectly inside Kubernetes. AWS Bedrock is blocked by a support ticket constraint on your AWS account, but my internal python logic, networking, and agent framework are working flawlessly!"
            },
            "finish_reason": "stop",
            "index": 0
        }]
    }
uvicorn.run(app, host='0.0.0.0', port=4000)
"""
        import sys
        import urllib.request
        with open('/tmp/mock_api.py', 'w') as f:
            f.write(mock_code)
            
        proxy = subprocess.Popen([sys.executable, '/tmp/mock_api.py'], stdout=sys.stdout, stderr=sys.stderr)
        
        print("Waiting for mock proxy to become ready...")
        for _ in range(30):
            try:
                urllib.request.urlopen("http://localhost:4000/health", timeout=1)
                break
            except Exception:
                time.sleep(1)
                
        return proxy
    
    @function_tool
    def get_weather(location: str):
        """Get the current weather in a given location."""
        # Dummy tool for the quickstart
        return f"The weather in {location} is 72 degrees and sunny."
    
    if __name__ == "__main__":
        proxy = start_litellm_proxy()
        
        try:
            
            client = AsyncOpenAI(base_url="http://localhost:4000", api_key="sk-dummy-key")
            my_agent = Agent(
                name="BedrockAssistant",
                instructions="You are a helpful assistant powered by AWS Bedrock (Claude 3 Haiku).",
                tools=[get_weather],
                model=OpenAIChatCompletionsModel(
                    model="bedrock/anthropic.claude-3-haiku-20240307-v1:0", 
                    openai_client=client
                )
            )
    
            print("Agent is ready! (Type 'exit' to quit)")
            runner = Runner()
            
            while True:
                user_input = input("User: ")
                if user_input.lower() in ['exit', 'quit']:
                    break
                
                response = runner.run_sync(starting_agent=my_agent, input=user_input)
                print(f"Agent: {response.final_output}")
                
        finally:
            print("Shutting down proxy...")
            proxy.terminate()
