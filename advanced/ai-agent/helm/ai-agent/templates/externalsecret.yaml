apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openai-external-secret
  labels:
    app: ai-agent
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: production-vault
    kind: ClusterSecretStore
  target:
    name: openai-secret
    creationPolicy: Owner
  data:
  - secretKey: OPENAI_API_KEY
    remoteRef:
      key: ai-agent-secrets
      property: openai-key
