apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "ai-agent.fullname" . }}-aws-creds
  labels:
    {{- include "ai-agent.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: production-vault
  target:
    name: {{ include "ai-agent.fullname" . }}-aws-creds
    creationPolicy: Owner
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: s3-backup-keys
        property: accessKey
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: s3-backup-keys
        property: secretKey
