config: |-
  apiVersion: v1alpha1
  static:
    - name: backup_bucket
      namespace: AWS/S3
      regions:
        - ap-south-1
      dimensions:
        - name: BucketName
          value: rke2-cluster-backups-20260702020323339500000001
      metrics:
        - name: BucketSizeBytes
          statistics:
          - Average
          period: 86400
          length: 86400
        - name: NumberOfObjects
          statistics:
          - Average
          period: 86400
          length: 86400
    - name: es_snapshot_bucket
      namespace: AWS/S3
      regions:
        - ap-south-1
      dimensions:
        - name: BucketName
          value: rke2-elasticsearch-snapshots-20260622040313615200000001
      metrics:
        - name: BucketSizeBytes
          statistics:
          - Average
          period: 86400
          length: 86400
        - name: NumberOfObjects
          statistics:
          - Average
          period: 86400
          length: 86400
    - name: loki_logs_bucket
      namespace: AWS/S3
      regions:
        - ap-south-1
      dimensions:
        - name: BucketName
          value: rke2-loki-logs-20260702020323341000000002
      metrics:
        - name: BucketSizeBytes
          statistics:
          - Average
          period: 86400
          length: 86400
        - name: NumberOfObjects
          statistics:
          - Average
          period: 86400
          length: 86400


serviceMonitor:
  enabled: true
  namespace: monitoring
  selector:
    release: prometheus-stack
