apiVersion: v1
kind: ConfigMap
metadata:
  name: s3-yace-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  s3-dashboard.json: |-
    {
      "title": "AWS S3 Monitoring (YACE)",
      "tags": ["s3", "aws"],
      "timezone": "browser",
      "schemaVersion": 16,
      "version": 0,
      "refresh": "1m",
      "panels": [
        {
          "type": "timeseries",
          "title": "S3 Bucket Size (Bytes)",
          "gridPos": { "h": 10, "w": 12, "x": 0, "y": 0 },
          "targets": [
            {
              "expr": "aws_s3_bucket_size_bytes_average",
              "legendFormat": "{{dimension_BucketName}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes"
            },
            "overrides": []
          }
        },
        {
          "type": "timeseries",
          "title": "S3 Object Count",
          "gridPos": { "h": 10, "w": 12, "x": 12, "y": 0 },
          "targets": [
            {
              "expr": "aws_s3_number_of_objects_average",
              "legendFormat": "{{dimension_BucketName}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          }
        }
      ]
    }
