apiVersion: v1
kind: Service
metadata:
  name: kanister-metrics
  namespace: kanister
  labels:
    app: kanister-operator
spec:
  ports:
  - name: metrics
    port: 8000
    targetPort: 8000
  selector:
    app: kanister-operator
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: kanister
  namespace: monitoring
  labels:
    release: prometheus-stack
spec:
  selector:
    matchLabels:
      app: kanister-operator
  namespaceSelector:
    matchNames:
      - kanister
  endpoints:
  - port: metrics
