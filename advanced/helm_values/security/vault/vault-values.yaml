global:
  tlsDisable: false
server:
  extraVolumes:
    - type: secret
      name: vault-tls
  extraEnvironmentVars:
    VAULT_CACERT: /vault/userconfig/vault-tls/ca.crt
    VAULT_ADDR: "https://127.0.0.1:8200"
  dataStorage:
    size: 1Gi
  affinity: ""
  ha:
    enabled: true
    replicas: 3
    raft:
      enabled: true
      setNodeId: true
      config: |
        ui = true
        telemetry {
          prometheus_retention_time = "30s"
          disable_hostname = true
        }
        listener "tcp" {
          tls_disable = 0
          tls_cert_file = "/vault/userconfig/vault-tls/tls.crt"
          tls_key_file  = "/vault/userconfig/vault-tls/tls.key"
          address = "[::]:8200"
          cluster_address = "[::]:8201"
          telemetry {
            unauthenticated_metrics_access = "true"
          }
        }
        storage "raft" {
          path = "/vault/data"
        }
        seal "awskms" {
              region     = "ap-south-1"
              kms_key_id = "ad9aeabc-b516-4b28-9486-4e8ce7c955e6"
        }

injector:
  enabled: false

serverTelemetry:
  serviceMonitor:
    enabled: true
    selectors:
      matchLabels:
        app.kubernetes.io/name: vault
  prometheusRules:
    enabled: true
