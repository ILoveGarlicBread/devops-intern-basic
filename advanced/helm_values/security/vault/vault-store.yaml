    apiVersion: external-secrets.io/v1
    kind: ClusterSecretStore
    metadata:
      name: production-vault
    spec:
      provider:
        vault:
          server: "https://vault.vault.svc.cluster.local:8200"
          path: "secret"
          version: "v2"
          caProvider:
            type: Secret
            name: vault-tls
            namespace: vault
            key: ca.crt
          auth:
            kubernetes:
              mountPath: "kubernetes"
              role: "eso-role"
              serviceAccountRef:
                name: "external-secrets"
                namespace: "external-secrets"

