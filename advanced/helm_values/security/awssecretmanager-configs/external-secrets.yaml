apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: prometheus-slack-webhook-ext
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: prometheus-slack-webhook
    creationPolicy: Owner
  data:
  - secretKey: slack-api-url
    remoteRef:
      key: prometheus-slack-webhook
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: fineract-db-passwords-ext
  namespace: fineract
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: fineract-db-passwords
    creationPolicy: Owner
  data:
  - secretKey: rootPassword
    remoteRef:
      key: fineract-db-passwords
      property: rootPassword
  - secretKey: password
    remoteRef:
      key: fineract-db-passwords
      property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backup-s3-credentials-ext
  namespace: fineract
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: backup-s3-credentials
    creationPolicy: Owner
  data:
  - secretKey: AWS_ACCESS_KEY_ID
    remoteRef:
      key: s3-backup-keys
      property: accessKey
  - secretKey: AWS_SECRET_ACCESS_KEY
    remoteRef:
      key: s3-backup-keys
      property: secretKey
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: velero-aws-creds-ext
  namespace: velero
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: velero-aws-creds
    template:
      data:
        # Velero requires this exact INI format inside a key named "cloud"
        cloud: |
          [default]
          aws_access_key_id={{ .aws_access }}
          aws_secret_access_key={{ .aws_secret }}
  data:
  - secretKey: aws_access
    remoteRef:
      key: s3-backup-keys
      property: accessKey
  - secretKey: aws_secret
    remoteRef:
      key: s3-backup-keys
      property: secretKey
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: loki-s3-credentials-ext
  namespace: logging
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: loki-s3-secret
    creationPolicy: Owner
  data:
  - secretKey: AWS_ACCESS_KEY_ID
    remoteRef:
      key: s3-backup-keys
      property: accessKey
  - secretKey: AWS_SECRET_ACCESS_KEY
    remoteRef:
      key: s3-backup-keys
      property: secretKey

