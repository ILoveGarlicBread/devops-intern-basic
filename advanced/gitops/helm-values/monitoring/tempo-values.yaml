# tempo-values.yaml
# Lightweight Single-Binary mode with S3 backend
replicas: 1

tempo:
  repository: grafana/tempo
  retention: 72h
  reportingEnabled: false

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1536Mi

  storage:
    trace:
      backend: s3
      s3:
        bucket: rke2-cluster-backups-20260702020323339500000001
        endpoint: s3.ap-south-1.amazonaws.com
        region: ap-south-1
        insecure: false
      wal:
        path: /var/tempo/wal
      local:
        path: /var/tempo/traces

  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"
        http:
          endpoint: "0.0.0.0:4318"

  server:
    http_listen_port: 3200

  metricsGenerator:
    enabled: true
    remoteWriteUrl: "http://prometheus-stack-kube-prom-prometheus.monitoring.svc.cluster.local:9090/api/v1/write"
    processor:
      service_graphs:
        max_items: 10000
      span_metrics:
        enable_target_info: true
      local_blocks:
        flush_to_storage: true
    storage:
      path: "/var/tempo/metrics"
    traces_storage:
      path: "/var/tempo/metrics-traces"

  extraEnvFrom:
    - secretRef:
        name: tempo-s3-secret

persistence:
  enabled: true
  storageClassName: longhorn
  accessModes:
    - ReadWriteOnce
  size: 5Gi
