controller:
  csrf:
    defaultCrumbIssuer:
      enabled: false
  image:
    tag: "latest-jdk17"
  installPlugins:
    - kubernetes
    - workflow-aggregator
    - git
    - configuration-as-code
    - docker-workflow
  ingress:
    enabled: true
    hostName: jenkins.lblam.tma-demos.shop
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
    tls:
      - secretName: jenkins-tls
        hosts:
          - jenkins.lblam.tma-demos.shop
persistence:
  enabled: true
  storageClass: longhorn
  size: "15Gi"
