controller:
  csrf:
    defaultCrumbIssuer:
      enabled: false
  image:
    tag: "latest-jdk17"
  installPlugins:
    - kubernetes
    - workflow-aggregator
    - git
    - configuration-as-code
    - docker-workflow
    - job-dsl
  JCasC:
    defaultConfig: true
    configScripts:
      gitops-jobs: |
        jobs:
          - script: >
              pipelineJob('ai-agent-cd') {
                  definition {
                      cpsScm {
                          scm {
                              git {
                                  remote {
                                      url('ssh://git-codecommit.ap-south-1.amazonaws.com/v1/repos/ai-agent-app')
                                      credentials('codecommit-ssh')
                                  }
                                  branch('*/main')
                              }
                          }
                          scriptPath('Jenkinsfile')
                          lightweight(true)
                      }
                  }
                  triggers {
                      scm('* * * * *')
                  }
              }
  ingress:
    enabled: true
    apiVersion: "networking.k8s.io/v1"
    ingressClassName: "nginx"
    hostName: jenkins.lblam.tma-demos.shop
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
      nginx.ingress.kubernetes.io/proxy-body-size: "128m"
      nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    tls:
      - secretName: jenkins-tls
        hosts:
          - jenkins.lblam.tma-demos.shop
persistence:
  enabled: true
  storageClass: longhorn
  size: "15Gi"
