apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kanister-operator
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://charts.kanister.io'
    chart: kanister-operator
    targetRevision: 0.113.0
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: kanister
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
