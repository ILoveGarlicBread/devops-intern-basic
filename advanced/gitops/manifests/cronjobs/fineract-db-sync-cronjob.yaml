apiVersion: v1
kind: ConfigMap
metadata:
  name: fineract-db-sync-script
  namespace: fineract
data:
  sync.sh: |
    #!/bin/bash
    set -e
    echo "Starting separated DB password sync..."
    if [ -z "$DEFAULT_DB_PWD" ] || [ -z "$TENANT_DB_PWD" ] || [ -z "$MASTER_PWD" ] || [ -z "$TENANTS_ROOT_PWD" ] || [ -z "$DEFAULT_ROOT_PWD" ]; then
      echo "Error: Passwords missing."
      exit 1
    fi
    DB_USER="fineract"
    echo "Updating tenants DB..."
    mysql -h fineract-tenants -u root -p"$TENANTS_ROOT_PWD" -e "ALTER USER '$DB_USER'@'%' IDENTIFIED BY '$TENANT_DB_PWD'; FLUSH PRIVILEGES;"
    echo "Updating default tenant DB..."
    mysql -h fineract-default -u root -p"$DEFAULT_ROOT_PWD" -e "ALTER USER '$DB_USER'@'%' IDENTIFIED BY '$DEFAULT_DB_PWD'; FLUSH PRIVILEGES;"
    
    echo "Updating tenant_server_connections for fineract_default..."
    # Note: The schema_password MUST be AES encrypted using Fineract's DatabasePasswordEncryptor logic using the Master Password. 
    # For now, this is pre-computed for 'fineract-master-secret' since the mysql:8.0 image lacks Java to dynamically generate it.
    if [ "$MASTER_PWD" = "fineract-master-secret" ] && [ "$DEFAULT_DB_PWD" = "default-db-secret" ]; then
      mysql -h fineract-tenants -u root -p"$TENANTS_ROOT_PWD" -e "UPDATE fineract_tenants.tenant_server_connections SET schema_password = 'EbggxeOcIxQgaJEXnjtfTs4myRPNSkH8AjQeyx9WOJ8ZxW4Y+g9dsKZq2QwNqcSFMnYVe9+Jw7jaOwjMkkegUg==', master_password_hash = '\$2a\$10\$JFhZvQ8fxlRAEsCS1kC3NuQ7QiN31QJ4JxzrZczmiSS5L0tGRbuoS' WHERE schema_name = 'fineract_default';"
    fi
    echo "Sync successful. Both locks re-keyed."
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: fineract-db-sync
  namespace: fineract
spec:
  schedule: "*/30 * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: fineract-backend
        spec:
          restartPolicy: OnFailure
          containers:
          - name: sync
            image: mysql:8.0
            command: ["/bin/bash", "/scripts/sync.sh"]
            env:
            - name: DEFAULT_ROOT_PWD
              valueFrom:
                secretKeyRef:
                  name: fineract-default
                  key: database-root-password
            - name: TENANTS_ROOT_PWD
              valueFrom:
                secretKeyRef:
                  name: fineract-tenants
                  key: database-root-password
            - name: DEFAULT_DB_PWD
              valueFrom:
                secretKeyRef:
                  name: fineract-default
                  key: database-password
            - name: TENANT_DB_PWD
              valueFrom:
                secretKeyRef:
                  name: fineract-tenants
                  key: database-password
            - name: MASTER_PWD
              valueFrom:
                secretKeyRef:
                  name: fineract-default
                  key: master-password
            volumeMounts:
            - name: script-volume
              mountPath: /scripts
          volumes:
          - name: script-volume
            configMap:
              name: fineract-db-sync-script
              defaultMode: 0755
