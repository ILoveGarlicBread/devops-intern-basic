apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-repo-secret-ai-agent-ext
  namespace: argocd
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: production-vault
    kind: ClusterSecretStore
  target:
    name: repo-ai-agent-manifests
    creationPolicy: Owner
    template:
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repository
      data:
        type: git
        url: ssh://APKAS7ZMGBTBFHE4AQG3@git-codecommit.ap-south-1.amazonaws.com/v1/repos/ai-agent-manifests
        insecure: "true"
        sshPrivateKey: "{{ .sshPrivateKey }}"
  data:
  - secretKey: sshPrivateKey
    remoteRef:
      key: argocd/codecommit-ssh-key
      property: sshPrivateKey
