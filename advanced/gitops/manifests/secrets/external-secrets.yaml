apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: velero-aws-creds-ext
  namespace: velero
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: production-vault
  target:
    name: velero-aws-creds
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        # Velero requires this exact INI format inside a key named "cloud"
        cloud: |
          [default]
          aws_access_key_id={{ .aws_access }}
          aws_secret_access_key={{ .aws_secret }}
  data:
  - secretKey: aws_access
    remoteRef:
      key: s3-backup-keys
      property: accessKey
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
  - secretKey: aws_secret
    remoteRef:
      key: s3-backup-keys
      property: secretKey
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
---
