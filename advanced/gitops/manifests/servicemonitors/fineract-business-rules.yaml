apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: fineract-business-alerts
  namespace: monitoring
  labels:
    release: prometheus-stack
spec:
  groups:
  - name: fineract.business.rules
    rules:
    - alert: FineractZeroClients
      expr: fineract_clients_total == 0
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: "No clients found in Fineract database"
        description: "Fineract database is reporting 0 clients for 5 minutes. Possible data loss or exporter connection issue."
    - alert: FineractHighLoanVolume
      expr: delta(fineract_loans_total[30m]) > 10
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "High rate of new loans in Fineract"
        description: "There were {{ $value }} new loans created in Fineract over the last 30 minutes."
    - alert: FineractHighAccountVolume
      expr: delta(fineract_accounts_total[30m]) > 20
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "High rate of new savings accounts in Fineract"
        description: "There were {{ $value }} new savings accounts created in Fineract over the last 30 minutes."
