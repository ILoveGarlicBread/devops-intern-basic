# TODO: add option to install ActiveMQ?

fineractServer:
  # -- Number of backend pods
  replicas: 1
  image:
    # -- Fineract Docker image name
    name: apache/fineract
    # -- Fineract Docker image tag
    tag: 1.12.1
  # -- Dictionary of key/value pairs to pass as environment variables to the backend pods
  # They will be evaluated as Helm templates
  # @default -- See `values.yaml`
  extraEnv:
    DRIVERCLASS_NAME: com.mysql.cj.jdbc.Driver
    PROTOCOL: jdbc
    SUB_PROTOCOL: mysql
    fineract_tenants_driver: com.mysql.cj.jdbc.Driver
    FINERACT_DEFAULT_TENANTDB_PORT: "3306"
    LOG_OUTPUT_TYPE: console_plain
    MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "prometheus,health,info"
    MANAGEMENT_ENDPOINT_PROMETHEUS_ENABLED: "true"
    MANAGEMENT_METRICS_EXPORT_PROMETHEUS_ENABLED: "true"
    JAVA_TOOL_OPTIONS: "-javaagent:/otel/opentelemetry-javaagent.jar"
    OTEL_SERVICE_NAME: "fineract-backend"
    OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-gateway-opentelemetry-collector.logging.svc.cluster.local:4317"
    OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
    OTEL_TRACES_EXPORTER: "otlp"
    OTEL_METRICS_EXPORTER: "none"
    OTEL_LOGS_EXPORTER: "none"
    OTEL_INSTRUMENTATION_COMMON_DEFAULT_ENABLED: "true"
    OTEL_INSTRUMENTATION_LOGBACK_APPENDER_ENABLED: "true"
  # -- Same as `extraEnv` but passed as secrets
  extraSecretEnv: {}
  # -- Resource settings for Backend pods
  resources:
    requests:
      cpu: "100m"
      memory: "1Gi"
    limits:
      cpu: "2000m"
      memory: "4Gi"
  # -- Node labels for pod assignment
  nodeSelector: {}
  # -- Node affinity for pod assignment
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: workload
            operator: In
            values:
            - fineract
            - infra-ops
  # -- Node tolerations for pod assignment
  tolerations: []
  # -- ServiceAccount settings
  serviceAccount:
    ## Specifies whether a ServiceAccount should be created
    ##
    create: true
    ## The name of the ServiceAccount to use.
    ## If not set and create is true, a name is generated using the mysql.fullname template
    ##
    # name:
    ## Annotations to add to the service account (evaluated as a template)
    ##
    name: "fineractserver-sa"

    automount: true

    annotations: {}      

fineractUI:
  # -- Number of frontend pods
  replicas: 1
  image:
    # -- Frontend Docker image name
    # name: openmf/community-app
    name: openmf/community-app
    # -- Frontend Docker image tag
    tag: latest
  # -- Resource settings for Backend pods
  resources:
    limits:
      cpu: "100m"
      memory: "100Mi"
  # -- Node labels for pod assignment
  nodeSelector: {}
  # -- Node affinity for pod assignment
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: workload
            operator: In
            values:
            - fineract
            - infra-ops
  # -- Node tolerations for pod assignment
  tolerations: []
  # -- ServiceAccount settings
  serviceAccount:
    ## Specifies whether a ServiceAccount should be created
    ##
    create: true
    ## The name of the ServiceAccount to use.
    ## If not set and create is true, a name is generated using the mysql.fullname template
    ##
    # name:
    ## Annotations to add to the service account (evaluated as a template)
    ##
    name: "fineractui-sa"

    automount: true

    annotations: {}         

global:
  db:
    # -- DB name for tenants db
    tenantsDb: fineract_tenants
    # -- DB name for defaults db
    defaultDb: fineract_default
route:
  enabled: false  
  host: fineract.openshiftapps.com
# -- MySQL settings - see https://artifacthub.io/packages/helm/bitnami/mysql
# @default -- see `values.yaml`
mysql:
  # -- Install MySQL?
  enabled: false
  # -- Node labels for pod assignment
  nodeSelector: {}
  # -- Node affinity for pod assignment
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: workload
            operator: In
            values:
            - fineract
            - infra-ops
  # -- Node tolerations for pod assignment
  tolerations: []
  auth:
    existingSecret: 'fineract-db-passwords'
    # -- Fineract db user
    username: fineract

service:
  # -- Service type for Fineract and UI services
  type: ClusterIP

ingress:
  # -- Create Ingress?
  enabled: false
  # -- Ingress annotations
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  # -- List of domains to serve on
  hosts: []
  # -- TLS settings
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

