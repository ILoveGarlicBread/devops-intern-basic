apiVersion: v1
kind: ConfigMap
metadata:
  name: fineract-nginx-proxy-conf
  namespace: {{ .Release.Namespace }}
data:
  default.conf: |
    server {
        listen 3000;
        server_name _;
        
        access_log /dev/stdout;
        error_log /dev/stderr;

        # Direct backend API calls to the Java Engine service
        location /fineract-provider {
            proxy_pass http://{{ .Release.Name }}-backend.{{ .Release.Namespace }}.svc.cluster.local:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
            # === ADD THESE CORS HEADERS ===
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Fineract-Platform-TenantId, Authorization' always;

            # Handle OPTIONS preflight requests immediately
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*';
                add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE';
                add_header 'Access-Control-Allow-Headers' 'Content-Type, Fineract-Platform-TenantId, Authorization';
                add_header 'Content-Length' 0;
                add_header 'Content-Type' 'text/plain; charset=utf-8';
                return 204;
            }
        }
        # Force catch the UI config request and answer it dynamically
        location = /configs.json {
            default_type application/json;
            return 200 '{"baseApiUrl":"https://fineract.lblam.tma-demos.shop/fineract-provider/api/v1","apiProvider":"/fineract-provider/api/v1","tenantIdentifier":"default"}';
        }

        # Direct structural assets to the UI service
        location / {
            proxy_pass http://{{ .Release.Name }}-ui.{{ .Release.Namespace }}.svc.cluster.local:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fineract-nginx-proxy
  namespace: {{ .Release.Namespace }}
  labels:
    app: fineract-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fineract-proxy
  template:
    metadata:
      labels:
        app: fineract-proxy
    spec:
      {{- with .Values.fineractUI.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.fineractUI.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.fineractUI.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: fineractserver-sa
      volumes:
        - name: nginx-config-volume
          configMap:
            name: fineract-nginx-proxy-conf
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-pid
          emptyDir: {}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx-proxy
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          image: nginx:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http-proxy
          volumeMounts:
            - name: nginx-config-volume
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-pid
              mountPath: /var/run
          resources:
            limits:
              cpu: "500m"
              memory: "512Mi"
            requests:
              cpu: "200m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: fineract-nginx-service
  namespace: {{ .Release.Namespace }}
  labels:
    app: fineract-proxy
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3000
      targetPort: 3000
  selector:
    app: fineract-proxy
