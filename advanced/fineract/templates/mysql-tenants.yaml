
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: fineract-tenants
  labels:
    app: fineract-tenants
    app.kubernetes.io/component: fineract-tenants
    app.kubernetes.io/instance: fineract-tenants
    app.kubernetes.io/name: fineract-tenants
    app.kubernetes.io/part-of: fineract-tenants
    app.openshift.io/runtime: mariadb
spec:
  serviceName: fineract-tenants
  replicas: 1
  revisionHistoryLimit: 10
  test: false
  selector:
    matchLabels:
      app: fineract-tenants
  volumeClaimTemplates:
    - metadata:
        name: fineract-tenants-data
      spec:
        accessModes:
          - ReadWriteOnce
        volumeMode: Filesystem
        resources:
          requests:
            storage: 1Gi
  template:
    metadata:
      creationTimestamp: null
      labels:
        app: fineract-tenants
        app.openshift.io/runtime: mariadb
        deployment: fineract-tenants
    spec:
      {{- with .Values.mysql.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.mysql.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.mysql.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: fineractserver-sa            
      volumes:
        - name: tmp
          emptyDir: {}
        - name: mariadb-tmp
          emptyDir: {}
        - name: mariadb-logs
          emptyDir: {}
        - name: mariadb-conf
          emptyDir: {}
      containers:
        - resources:
            limits:
              memory: 512Mi
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - '-i'
                - '-c'
                - MARIADB_PWD="$MARIADB_PASSWORD" mariadb-admin ping -u $MARIADB_USER
            initialDelaySeconds: 5
            timeoutSeconds: 1
            periodSeconds: 10
            successThreshold: 1
            failureThreshold: 3
          terminationMessagePath: /dev/termination-log
          name: fineract-tenants
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - '-i'
                - '-c'
                - MARIADB_PWD="$MARIADB_PASSWORD" mariadb-admin ping -u $MARIADB_USER
            initialDelaySeconds: 30
            timeoutSeconds: 1
            periodSeconds: 10
            successThreshold: 1
            failureThreshold: 3
          env:
            - name: MARIADB_USER
              value: "fineract"
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fineract-tenants
                  key: database-password
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fineract-db-passwords
                  key: rootPassword
            - name: MARIADB_DATABASE
              value: "fineract_tenants"
          ports:
            - containerPort: 3306
              protocol: TCP
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: mariadb-tmp
              mountPath: /opt/bitnami/mariadb/tmp
            - name: mariadb-logs
              mountPath: /opt/bitnami/mariadb/logs
            - name: mariadb-conf
              mountPath: /opt/bitnami/mariadb/conf
            - name: fineract-tenants-data
              mountPath: /bitnami/mariadb/data
          terminationMessagePolicy: File
          image: bitnami/mariadb:latest
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      dnsPolicy: ClusterFirst
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      schedulerName: default-scheduler
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: fineract-tenants
    app.kubernetes.io/component: fineract-tenants
    app.kubernetes.io/instance: fineract-tenants
    app.kubernetes.io/name: fineract-tenants
    app.kubernetes.io/part-of: fineract-tenants
  name: fineract-tenants
spec:
  ports:
    - name: 3306-tcp
      protocol: TCP
      port: 3306
      targetPort: 3306
  selector:
    app: fineract-tenants
    deployment: fineract-tenants
---
