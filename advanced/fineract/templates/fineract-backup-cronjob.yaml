apiVersion: batch/v1
kind: CronJob
metadata:
  name: fineract-logical-backup
  namespace: {{ .Release.Namespace }}
spec:
  schedule: "30 9 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: backup-worker
            image: alpine:3.19
            command:
            - /bin/sh
            - -c
            - |
              apk add --no-cache mysql-client aws-cli
              
              DATE=$(date +%Y%m%d-%H%M%S)
              FILE="/tmp/fineract-db-$DATE.sql.gz"
              BUCKET="s3://rke2-cluster-backups-20260702020323339500000001/logical-backups"
              
              echo "Dumping default database..."
              mysqldump -h fineract-default -u root -p"$MYSQL_ROOT_PASSWORD" --all-databases | gzip > /tmp/fineract-default-$DATE.sql.gz
              
              echo "Dumping tenants database..."
              mysqldump -h fineract-tenants -u root -p"$MYSQL_ROOT_PASSWORD" --all-databases | gzip > /tmp/fineract-tenants-$DATE.sql.gz
              
              echo "Uploading to S3..."
              aws s3 cp /tmp/fineract-default-$DATE.sql.gz $BUCKET/
              aws s3 cp /tmp/fineract-tenants-$DATE.sql.gz $BUCKET/
            env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fineract-default 
                  key: database-root-password
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: backup-s3-credentials
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: backup-s3-credentials
                  key: AWS_SECRET_ACCESS_KEY
            - name: AWS_DEFAULT_REGION
              value: "ap-south-1" 
          restartPolicy: OnFailure
