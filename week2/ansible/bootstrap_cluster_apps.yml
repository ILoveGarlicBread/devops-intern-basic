---
- name: Bootstrap Kubernetes Core Apps and Configuration
  hosts: localhost
  gather_facts: false

  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    master_node_ip: "{{ hostvars[groups['master'][0]]['ansible_host'] }}"
    ssh_user: "ubuntu"
    ssh_key_path: "~/.ssh/id_rsa"

  tasks:
    - name: Ensure local .kube directory exists
      ansible.builtin.file:
        path: "~/.kube"
        state: directory
        mode: '0700'

    - name: Fetch kubeconfig file from the RKE2 master node
      ansible.builtin.slurp:
        src: /etc/rancher/rke2/rke2.yaml
      delegate_to: "{{ master_node_ip }}"
      remote_user: "{{ ssh_user }}"
      become: true
      vars:
        ansible_ssh_private_key_file: "{{ ssh_key_path }}"
      register: remote_kubeconfig

    - name: Format and save kubeconfig onto the main control station
      ansible.builtin.copy:
        content: "{{ remote_kubeconfig.content | b64decode | replace('127.0.0.1', master_node_ip) }}"
        dest: "~/.kube/config"
        mode: '0600'

