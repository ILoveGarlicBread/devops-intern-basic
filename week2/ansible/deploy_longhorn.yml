---
- name: Play 1 - Prepare Worker Node OS Host
  hosts: worker
  become: yes
  tasks:
    - name: Install open-iscsi and NFS utilities
      apt:
        name:
          - open-iscsi
          - nfs-common
        state: present
        update_cache: yes

    - name: Ensure iscsid service is started and enabled
      systemd:
        name: iscsid
        state: started
        enabled: yes

- name: Play 2 - Install Helm and Deploy Longhorn Chart
  hosts: master
  become: yes
  tasks:
    - name: Check if Helm binary exists
      stat:
        path: /usr/local/bin/helm
      register: helm_binary

    - name: Download and install Helm if missing
      shell: "curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash"
      when: not helm_binary.stat.exists

    - name: Add Longhorn Helm repository
      kubernetes.core.helm_repository:
        name: longhorn
        repo_url: "https://charts.longhorn.io"

    - name: Deploy Longhorn via Helm Module
      kubernetes.core.helm:
        name: longhorn
        chart_ref: longhorn/longhorn
        release_namespace: longhorn-system
        create_namespace: yes
        # Point Ansible to the RKE2 kubeconfig file on the master node
        kubeconfig: /etc/rancher/rke2/rke2.yaml
