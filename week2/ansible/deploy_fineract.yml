- name: Play 2 - Deploy Fineract via Native Kubernetes Manifests
  hosts: master
  become: yes
  tasks:
    - name: Clone official Apache Fineract source code
      git:
        repo: 'https://github.com/apache/fineract.git'
        dest: /home/ubuntu/fineract-source
        version: HEAD

    # --- ADD THIS TASK HERE ---
    - name: Create the Missing Database Secret
      kubernetes.core.k8s:
        kubeconfig: /etc/rancher/rke2/rke2.yaml
        namespace: default
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: fineract-tenants-db-secret
          type: Opaque
          stringData:
            username: "root"
            mysql-root-password: "password"
            password: "password"
    # ---------------------------

    - name: Deploy Database ConfigMap and Services
      kubernetes.core.k8s:
        kubeconfig: /etc/rancher/rke2/rke2.yaml
        src: "/home/ubuntu/fineract-source/kubernetes/{{ item }}"
        namespace: default
        state: present
      loop:
        - fineractmysql-configmap.yml
        - fineractmysql-deployment.yml
        - fineract-server-deployment.yml
        - fineract-mifoscommunity-deployment.yml

    - name: Deploy Custom Ingress to Bypass Corporate Firewall
      kubernetes.core.k8s:
        kubeconfig: /etc/rancher/rke2/rke2.yaml
        namespace: default
        state: present
        definition:
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: fineract-ingress
            annotations:
              kubernetes.io/ingress.class: "nginx"
              nginx.ingress.kubernetes.io/rewrite-target: /
          spec:
            rules:
              - host: fineract.local
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: fineract-mifoscommunity
                          port:
                            number: 80
                    - path: /fineract-provider
                      pathType: Prefix
                      backend:
                        service:
                          name: fineract-server
                          port:
                            number: 8080
