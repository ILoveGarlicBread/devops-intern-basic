apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: prometheus-slack-webhook-ext
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: prometheus-slack-webhook
    creationPolicy: Owner
  data:
  - secretKey: slack-api-url
    remoteRef:
      key: prometheus-slack-webhook
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: fineract-db-passwords-ext
  namespace: fineract
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: fineract-db-passwords
    creationPolicy: Owner
  data:
  - secretKey: rootPassword
    remoteRef:
      key: fineract-db-passwords
      property: rootPassword
  - secretKey: password
    remoteRef:
      key: fineract-db-passwords
      property: password
