# otel-gateway-values.yaml
mode: deployment
replicaCount: 3

image:
  repository: otel/opentelemetry-collector-contrib

config:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

  processors:
    memory_limiter:
      check_interval: 1s
      limit_mib: 1500
    batch:
      send_batch_size: 1000
      timeout: 1s

  exporters:
    otlphttp:
      # Loki 3.0+ native OTLP endpoint
      logs_endpoint: "http://loki-write.logging.svc.cluster.local:3100/otlp/v1/logs"
      tls:
        insecure: true

  service:
    pipelines:
      logs:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [otlphttp]
