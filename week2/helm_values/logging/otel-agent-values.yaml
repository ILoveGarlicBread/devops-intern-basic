# otel-agent-values.yaml
mode: daemonset

image:
  repository: otel/opentelemetry-collector-contrib

# Grant RBAC permissions for k8sattributes processor
clusterRole:
  create: true
  rules:
    - apiGroups: [""]
      resources: ["pods", "namespaces"]
      verbs: ["get", "watch", "list"]
    - apiGroups: ["apps"]
      resources: ["replicasets"]
      verbs: ["get", "list", "watch"]
    - apiGroups: ["extensions"]
      resources: ["replicasets"]
      verbs: ["get", "list", "watch"]

# Important: Mount host log directories so OTel can read them
extraVolumes:
  - name: varlog
    hostPath:
      path: /var/log
extraVolumeMounts:
  - name: varlog
    mountPath: /var/log
    readOnly: true

config:
  receivers:
    filelog:
      include: [ /var/log/containers/*.log ]
      exclude: [ /var/log/containers/*_fineract_*.log ]
      start_at: beginning
      include_file_path: true
      operators:
        - type: regex_parser
          parse_from: attributes["log.file.path"]
          regex: '^/var/log/containers/(?P<k8s_pod_name>[^_]+)_(?P<k8s_namespace_name>[^_]+)_(?P<k8s_container_name>.+)-(?P<container_id>[a-z0-9]{64})\.log$'
        - type: container
          add_metadata_from_filepath: false

    filelog/fineract:
      include: [ /var/log/containers/*_fineract_*.log ]
      start_at: beginning
      include_file_path: true
      operators:
        - type: regex_parser
          parse_from: attributes["log.file.path"]
          regex: '^/var/log/containers/(?P<k8s_pod_name>[^_]+)_(?P<k8s_namespace_name>[^_]+)_(?P<k8s_container_name>.+)-(?P<container_id>[a-z0-9]{64})\.log$'
        - type: container
          add_metadata_from_filepath: false
        - type: recombine
          combine_field: body
          is_first_entry: 'body matches "^\\d{4}-\\d{2}-\\d{2}"'
          source_identifier: attributes["log.file.path"]

  processors:
    k8sattributes:
      extract:
        metadata:
          - k8s.namespace.name
          - k8s.pod.name
          - k8s.container.name
    resource:
      attributes:
        - action: insert
          key: k8s.namespace.name
          from_attribute: k8s_namespace_name
        - action: insert
          key: k8s.pod.name
          from_attribute: k8s_pod_name
        - action: insert
          key: k8s.container.name
          from_attribute: k8s_container_name
        - action: insert
          key: loki.attribute.labels
          value: k8s.namespace.name,k8s.pod.name,k8s.container.name
    memory_limiter:
      check_interval: 1s
      limit_mib: 200
    batch:
      send_batch_size: 1000
      timeout: 1s

  exporters:
    otlp:
      endpoint: "otel-gateway-opentelemetry-collector.logging.svc.cluster.local:4317"
      tls:
        insecure: true

  service:
    pipelines:
      logs:
        receivers: [filelog, filelog/fineract]
        processors: [memory_limiter, k8sattributes, resource, batch]
        exporters: [otlp]
