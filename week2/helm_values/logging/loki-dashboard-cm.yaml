apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-kubernetes-logs
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  kubernetes-logs.json: |-
    {
      "title": "Kubernetes Logs Explorer (Loki)",
      "description": "Kibana-style Logs Explorer",
      "tags": ["logs", "kubernetes", "loki"],
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "10s",
      "templating": {
        "list": [
          {
            "name": "namespace",
            "type": "textbox",
            "query": "",
            "label": "Namespace"
          },
          {
            "name": "pod",
            "type": "textbox",
            "query": "",
            "label": "Pod"
          },
          {
            "name": "search",
            "type": "textbox",
            "query": "",
            "label": "Text Search"
          }
        ]
      },
      "panels": [
        {
          "type": "logs",
          "title": "Log Explorer",
          "gridPos": { "h": 20, "w": 24, "x": 0, "y": 0 },
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "Loki"
              },
              "expr": "{service_name=\"unknown_service\"} | k8s_namespace_name=~`.*$namespace.*` | k8s_pod_name=~`.*$pod.*` |= `$search`",
              "refId": "A"
            }
          ],
          "options": {
            "showTime": true,
            "showLabels": false,
            "showCommonLabels": false,
            "wrapLogMessage": true,
            "prettifyLogMessage": false,
            "enableLogDetails": true,
            "sortOrder": "Descending"
          }
        }
      ]
    }
