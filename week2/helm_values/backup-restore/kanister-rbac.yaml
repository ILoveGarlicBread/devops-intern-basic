apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kanister-secret-reader
rules:
- apiGroups: [""]
  resources: ["secrets", "pods", "pods/log", "persistentvolumeclaims"]
  verbs: ["get", "list", "watch", "create", "delete", "update", "patch"]
- apiGroups: ["apps"]
  resources: ["statefulsets", "deployments"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kanister-secret-reader-binding
subjects:
- kind: ServiceAccount
  name: kanister-kanister-operator
  namespace: kanister
roleRef:
  kind: ClusterRole
  name: kanister-secret-reader
  apiGroup: rbac.authorization.k8s.io
