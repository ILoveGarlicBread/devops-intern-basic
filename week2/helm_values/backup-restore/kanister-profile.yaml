apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kanister-aws-creds-ext
  namespace: kanister
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: kanister-aws-creds
    creationPolicy: Owner
  data:
    - secretKey: aws_access_key_id
      remoteRef:
        key: s3-backup-keys
        property: accessKey
    - secretKey: aws_secret_access_key
      remoteRef:
        key: s3-backup-keys
        property: secretKey
---
apiVersion: cr.kanister.io/v1alpha1
kind: Profile
metadata:
  name: kanister-s3-profile
  namespace: kanister
location:
  type: s3Compliant
  region: ap-south-1
  bucket: rke2-cluster-backups-20260702020323339500000001
  prefix: kanister/
credential:
  type: keyPair
  keyPair:
    idField: aws_access_key_id
    secretField: aws_secret_access_key
    secret:
      name: kanister-aws-creds
      namespace: kanister
