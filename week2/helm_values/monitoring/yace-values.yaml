config: |-
  apiVersion: v1alpha1
  discovery:
    jobs:
    - type: AWS/S3
      regions:
        - ap-south-1
      metrics:
        - name: BucketSizeBytes
          statistics:
          - Average
          period: 86400
          length: 86400
        - name: NumberOfObjects
          statistics:
          - Average
          period: 86400
          length: 86400


serviceMonitor:
  enabled: true
  namespace: monitoring
  selector:
    release: prometheus-stack
