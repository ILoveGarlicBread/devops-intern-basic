apiVersion: apps/v1
kind: Deployment
metadata:
  name: fineract-business-exporter
  namespace: fineract
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fineract-business-exporter
  template:
    metadata:
      labels:
        app: fineract-business-exporter
    spec:
      containers:
        - name: exporter
          image: alpine:latest
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fineract-db-passwords
                  key: password
          command: ["/bin/sh", "-c"]
          args:
            - |
              apk add --no-cache mysql-client netcat-openbsd
              while true; do
                CLIENTS=$(mysql -h fineract-default.fineract.svc.cluster.local -ufineract -p"$DB_PASSWORD" fineract_default -sN -e "SELECT COUNT(*) FROM m_client;" 2>/dev/null || echo 0)
                ACCOUNTS=$(mysql -h fineract-default.fineract.svc.cluster.local -ufineract -p"$DB_PASSWORD" fineract_default -sN -e "SELECT COUNT(*) FROM m_savings_account;" 2>/dev/null || echo 0)
                LOANS=$(mysql -h fineract-default.fineract.svc.cluster.local -ufineract -p"$DB_PASSWORD" fineract_default -sN -e "SELECT COUNT(*) FROM m_loan;" 2>/dev/null || echo 0)
                CARDS=0
                
                cat <<EOF > /tmp/metrics
              # HELP fineract_clients_total Total clients
              # TYPE fineract_clients_total gauge
              fineract_clients_total $CLIENTS
              # HELP fineract_accounts_total Total accounts
              # TYPE fineract_accounts_total gauge
              fineract_accounts_total $ACCOUNTS
              # HELP fineract_loans_total Total loans
              # TYPE fineract_loans_total gauge
              fineract_loans_total $LOANS
              # HELP fineract_cards_total Total cards
              # TYPE fineract_cards_total gauge
              fineract_cards_total $CARDS
              EOF
                
                echo -e "HTTP/1.1 200 OK\r\nContent-Type: text/plain; version=0.0.4\r\nContent-Length: $(wc -c < /tmp/metrics)\r\n\r\n$(cat /tmp/metrics)" | nc -l -p 8080 -q 1
              done
          ports:
            - containerPort: 8080
              name: metrics
---
apiVersion: v1
kind: Service
metadata:
  name: fineract-business-exporter
  namespace: fineract
  labels:
    app: fineract-business-exporter
spec:
  ports:
    - port: 8080
      targetPort: metrics
      name: metrics
  selector:
    app: fineract-business-exporter
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: fineract-business-exporter
  namespace: monitoring
  labels:
    release: prometheus-stack
spec:
  selector:
    matchLabels:
      app: fineract-business-exporter
  namespaceSelector:
    matchNames:
      - fineract
  endpoints:
    - port: metrics
      interval: 30s
